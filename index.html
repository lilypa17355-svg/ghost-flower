<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ghost Flower</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #dff5ed;
        }

        video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .pular {
            position: fixed;

            right: 15px;
            bottom: 15px;

            padding: 9px 14px;

            border: 2px solid #28776d;
            border-radius: 6px;

            background: rgba(255, 255, 255, 0.85);

            color: #175b55;

            font-family: Georgia, "Times New Roman", serif;

            font-weight: bold;

            cursor: pointer;

            z-index: 10;
        }

    </style>
</head>

<body>

    <video
        id="abertura"
        autoplay
        muted
        playsinline
    >

        <source
            src="abertura.mp4"
            type="video/mp4"
        >

    </video>


    <button
        class="pular"
        onclick="entrarNoSite()"
    >
        Pular
    </button>


    <script>

        const video = document.getElementById("abertura");


        function entrarNoSite() {

            window.location.href = "inicio.html";

        }


        video.addEventListener("ended", function() {

            entrarNoSite();

        });

    </script>

</body>

</html>
